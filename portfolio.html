<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — ES Photography</title>
<meta name="description" content="Architectural, aerial and interior photography of commercial real estate in Dallas–Fort Worth, Texas.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #b8b8b5; color: #111; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 24px 48px; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; text-decoration: none; color: #111; }
  nav a { margin-left: 32px; color: #111; text-decoration: none; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  nav a:hover { text-decoration: underline; }
  main { flex: 1; padding: 40px 48px 64px; }
  h1 { font-size: 36px; font-weight: 700; letter-spacing: -1px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid a { display: block; aspect-ratio: 3 / 2; overflow: hidden; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .3s; }
  .grid img:hover { opacity: .85; }
  .lightbox { position: fixed; inset: 0; background: rgba(20,20,20,.95); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  .lightbox img { max-width: 94vw; max-height: 92vh; }
  .lightbox.open { display: flex; }
  .btn { display: inline-block; margin-top: 48px; padding: 16px 40px; border: 2px solid #111; color: #111; text-decoration: none; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
  .btn:hover { background: #111; color: #b8b8b5; }
  footer { padding: 32px 48px; font-size: 12px; letter-spacing: 1px; color: #333; border-top: 1px solid #888; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { header { padding: 16px 20px; flex-direction: column; gap: 12px; } nav a { margin: 0 8px; font-size: 11px; } main { padding: 32px 20px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">ES Photography</a>
  <nav>
    <a href="portfolio.html">Portfolio</a>
    <a href="services.html">Services</a>
    <a href="credentials.html">Credentials</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="pay.html">Payment</a>
  </nav>
</header>
<main>
  <h1>Portfolio</h1>
  <div class="grid" id="grid"></div>
  <a class="btn" href="book.html">Book a shoot</a>
</main>
<div class="lightbox" id="lightbox"><img id="big" alt=""></div>
<footer>© ES Photography LLC · Dallas–Fort Worth, Texas</footer>
<script>
  const grid = document.getElementById('grid');
  const lightbox = document.getElementById('lightbox');
  const big = document.getElementById('big');
  for (let i = 1; i <= 12; i++) {
    const name = String(i).padStart(2, '0') + '.jpg';
    const link = document.createElement('a');
    link.href = name;
    const img = document.createElement('img');
    img.src = name;
    img.alt = 'Commercial architecture photography, Dallas–Fort Worth';
    img.loading = 'lazy';
    img.onerror = () => link.remove();
    link.appendChild(img);
    link.addEventListener('click', (e) => { e.preventDefault(); big.src = name; lightbox.classList.add('open'); });
    grid.appendChild(link);
  }
  lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });
</script>
</body>
</html>
